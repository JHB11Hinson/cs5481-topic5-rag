[project]
name = "ragqa"
version = "0.1.0"
description = "Grounded documentation QA with verifiable citations (CS5481 Topic 5)"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Ticket 04+: local embedding and reranking
models = ["torch>=2.1", "sentence-transformers>=2.7", "transformers>=4.40"]
# Ticket 05+: vector store
index = ["qdrant-client>=1.9"]
# Ticket 16: demo
demo = ["chainlit>=1.1"]
# Evaluation and reporting
report = ["pandas>=2.0", "matplotlib>=3.8"]
# Local issue-tracker workflow
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ragqa*"]
