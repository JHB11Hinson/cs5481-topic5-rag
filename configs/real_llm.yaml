# Real generation (ticket 06) against the OpenCode Go route.
# The Go subscription is a different base path from the plain zen catalog:
# /zen/go/v1, and requests must carry an x-opencode-session header or they route
# to the unfunded catalog and fail upstream.
run:
  name: real-llm
  out_root: runs

corpus:
  source: data/corpus/vault-1.21.x-1817bdfe/docs_structured.jsonl
  snapshot_id: vault-1.21.x-1817bdfe

chunk:
  strategy: recursive_parent_child
  size: 512
  overlap: 64
  parent_size: 1024

embed:
  provider: bge-m3
  model_id: BAAI/bge-m3
  device: cuda
  batch_size: 8
  max_seq_length: 1024
  late_max_seq_length: 8192
  cache_path: data/cache/embeddings.sqlite

index:
  backend: qdrant
  path: data/index

retrieval:
  mode: rerank
  k: 10
  rrf_k: 60
  reranker: BAAI/bge-reranker-v2-m3
  rerank_top: 12
  rerank_max_length: 512

context:
  mode: plain

generate:
  provider: llm
  model_id: llm
  abstain_score_threshold: -100.0   # the generator decides; see ADR-0011 note
  min_claim_overlap: 0.12
  max_claims: 3

llm:
  base_url: https://opencode.ai/zen/go/v1
  session_header: x-opencode-session
  model_generate: deepseek-v4.1-flash
  model_judge: deepseek-v4-pro
  cache_path: data/cache/llm.sqlite
  timeout: 180
  temperature: 0.0
  max_tokens: 1600
  context_chunks: 8
  price_in_usd_per_mtok: 0.15
  price_out_usd_per_mtok: 0.60

golden:
  items_path: golden/v0.jsonl
