# Reference cell plus both support judges (ticket 10).
#
# Byte-identical to `configs/grid/cell-recursive_parent_child-rerank-plain.yaml`
# except for the judge block. It exists so the report can quote citation numbers
# that passed containment AND two independent support judgements, and so the
# NLI x judge confusion grid has a run of its own — the 18 matrix cells keep the
# cheap containment-only path, because paying a model to agree with a string search
# 1,080 times buys nothing the 60-item calibration does not already establish.
run:
  name: judged-reference
  out_root: runs

corpus:
  source: data/corpus/vault-1.21.x-1817bdfe/docs_structured.jsonl
  snapshot_id: vault-1.21.x-1817bdfe

chunk:
  strategy: recursive_parent_child
  size: 512
  overlap: 64
  parent_size: 1024

embed:
  provider: bge-m3
  model_id: BAAI/bge-m3
  device: cuda
  batch_size: 8
  max_seq_length: 1024
  cache_path: data/cache/embeddings.sqlite

index:
  backend: qdrant
  path: data/index

retrieval:
  mode: rerank
  k: 10
  rrf_k: 60
  reranker: BAAI/bge-reranker-v2-m3
  rerank_top: 12
  rerank_max_length: 512

context:
  mode: plain

generate:
  provider: llm
  model_id: llm
  abstain_score_threshold: 0.0
  min_claim_overlap: 0.12
  max_claims: 3

judge:
  enabled: true
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  nli_threshold: 0.5
  llm_model: deepseek-v4-pro
  llm_max_chars: 2000

llm:
  session_header: x-opencode-session
  model_generate: deepseek-v4.1-flash
  model_judge: deepseek-v4-pro
  cache_path: data/cache/llm.sqlite
  timeout: 180
  temperature: 0.0
  max_tokens: 1600
  context_chunks: 8
  price_in_usd_per_mtok: 0.15
  price_out_usd_per_mtok: 0.60
  price_judge_in_usd_per_mtok: 0.60
  price_judge_out_usd_per_mtok: 2.40

golden:
  items_path: golden/v1.jsonl
