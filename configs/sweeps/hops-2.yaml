# hops-2 -- the retrieval hops sweep (ticket 13). Generated by `python -m ragqa sweep emit`
# or `python scripts/run_sweeps.py --emit`; edit `ragqa/sweeps.py`, never this file.
#
#   sweep base: configs/grid/cell-recursive_parent_child-rerank-plain.yaml
#               (recursive_parent_child / rerank / plain) + the answerable
#               stratum of golden v1 (40 items, no near-misses)
#   point     : retrieval.hops = 2
#   differs   : retrieval.hop_rewrite_model, retrieval.hops, retrieval.trigger_threshold
#   invariants: rerank_top = max(k, 12) (ADR-0011); same corpus, same golden
#               set, same prices as the reference cell.
#
#   trigger   : retrieval.trigger_threshold = 0.426134, the rerank abstention
#               working point of golden v1 (reports/abstention/
#               working-points.json), so a rewrite fires exactly where the
#               system would otherwise abstain. Identical in hops-1,
#               hops-2 and hops-3 so only the cap differs.
baseline:
  closed_book: false
  long_context: false
  long_context_max_chars: 12000
chunk:
  overlap: 64
  parent_size: 1024
  size: 512
  strategy: recursive_parent_child
context:
  mode: plain
  prefix_cache_path: data/cache/prefixes.sqlite
  prefix_concurrency: 4
  prefix_max_tokens: 200
  prefix_model: deepseek-v4.1-flash
  prefix_neighbours: 1
  prefix_prompt_version: v1
  prefix_reasoning_effort: none
  window_overlap: 256
  window_tokens: 2048
corpus:
  snapshot_id: vault-1.21.x-1817bdfe
  source: data/corpus/vault-1.21.x-1817bdfe/docs_structured.jsonl
embed:
  batch_size: 8
  cache_path: data/cache/embeddings.sqlite
  device: cuda
  dim: 256
  late_max_seq_length: 8192
  max_seq_length: 1024
  model_id: BAAI/bge-m3
  provider: bge-m3
generate:
  abstain_score_threshold: 0.0
  max_claims: 3
  min_claim_overlap: 0.12
  model_id: llm
  provider: llm
golden:
  items_path: golden/v1-answerable.jsonl
  limit: null
index:
  backend: qdrant
  path: data/index
judge:
  enabled: false
  llm_max_chars: 2000
  llm_model: ''
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  nli_threshold: 0.5
  reasoning_effort: ''
llm:
  base_url: ''
  cache_path: data/cache/llm.sqlite
  context_chunks: 8
  max_tokens: 1600
  model_generate: deepseek-v4.1-flash
  model_judge: deepseek-v4-pro
  price_in_usd_per_mtok: 0.15
  price_judge_in_usd_per_mtok: 0.0
  price_judge_out_usd_per_mtok: 0.0
  price_out_usd_per_mtok: 0.6
  reasoning_effort: ''
  session_header: x-opencode-session
  session_id: ''
  temperature: 0.0
  timeout: 180
retrieval:
  hop_rewrite_model: deepseek-v4.1-flash
  hops: 2
  k: 10
  mode: rerank
  rerank_max_length: 512
  rerank_top: 12
  reranker: BAAI/bge-reranker-v2-m3
  rrf_k: 60
  trigger_threshold: 0.426134
run:
  name: sweep-hops-2
  out_root: runs
