# Baseline 2 of 4: long context (ticket 14).
#
# Instead of ten retrieved chunks, the generator is handed the whole source
# document of the top-ranked chunk and nothing else — what a long-context model
# would have to read if the pipeline stopped after ranking a document.
#
# `baseline.long_context_max_chars: 20000` is a measured choice, not a round
# number picked by feel. The corpus is 1,268 documents totalling 5.62 M chars:
# median 1,573, p90 10,985, p95 16,677, p99 33,231, largest 195,456. What matters
# is not that distribution but the documents this cell will actually paste: the
# top-ranked document of every answerable golden item, longest 19,391 chars
# (reports/baselines/window-cost.json). 20,000 is the smallest round cap that
# holds every one of them whole, so the cell cannot lose an answer inside its own
# truncation. It also holds 19 of the 20 documents overall; the one it truncates
# belongs to a near-miss item.
#
# The price is not the reason to distrust this cell. On the golden items the
# whole-document prompt averages 2,269 tokens against the reference cell's 7,479,
# because ten chunks averaging 3.4 k chars paste more text than one document
# capped at 20 k chars. What the window costs is the citation handle: no chunk
# ids exist in the prompt, so the verifier has nothing to check a claim against.
#
# Declared against the reference cell `configs/grid/cell-recursive_parent_child-
# rerank-plain.yaml`: the keys this cell does not mean to move hold that cell's
# values (`llm.max_tokens` 1600, `generate.abstain_score_threshold` 0.0, and
# `context.prefix_model` set even though `context.mode: plain` leaves it idle).
run:
  name: baseline-long-context
  out_root: runs

corpus:
  source: data/corpus/vault-1.21.x-1817bdfe/docs_structured.jsonl
  snapshot_id: vault-1.21.x-1817bdfe

chunk:
  strategy: recursive_parent_child
  size: 512
  overlap: 64
  parent_size: 1024

embed:
  provider: bge-m3
  model_id: BAAI/bge-m3
  device: cuda
  batch_size: 8
  max_seq_length: 1024
  cache_path: data/cache/embeddings.sqlite

index:
  backend: qdrant
  path: data/index

retrieval:
  mode: rerank
  k: 10
  rrf_k: 60
  reranker: BAAI/bge-reranker-v2-m3
  rerank_top: 12
  rerank_max_length: 512

context:
  mode: plain
  prefix_model: deepseek-v4.1-flash

generate:
  provider: llm
  model_id: llm
  abstain_score_threshold: 0.0
  min_claim_overlap: 0.12
  max_claims: 3

llm:
  session_header: x-opencode-session
  model_generate: deepseek-v4.1-flash
  model_judge: deepseek-v4-pro
  cache_path: data/cache/llm.sqlite
  timeout: 180
  temperature: 0.0
  max_tokens: 1600
  context_chunks: 8
  price_in_usd_per_mtok: 0.15
  price_out_usd_per_mtok: 0.60

baseline:
  long_context: true
  long_context_max_chars: 20000

golden:
  items_path: golden/v1.jsonl
