# Reranked retrieval over the Vault snapshot (ticket 05, level three).
run:
  name: real-rerank
  out_root: runs

corpus:
  source: data/corpus/vault-1.21.x-1817bdfe/docs_structured.jsonl
  snapshot_id: vault-1.21.x-1817bdfe

chunk:
  strategy: recursive_parent_child
  size: 512
  overlap: 64
  parent_size: 1024

embed:
  provider: bge-m3
  model_id: BAAI/bge-m3
  device: cuda
  batch_size: 8
  max_seq_length: 1024
  cache_path: data/cache/embeddings.sqlite

index:
  backend: qdrant
  path: data/index

retrieval:
  mode: rerank
  k: 10
  rrf_k: 60
  reranker: BAAI/bge-reranker-v2-m3
  rerank_top: 12

context:
  mode: plain

generate:
  provider: stub
  model_id: stub-generator
  # Cross-encoder logits, not cosine and not RRF: a different scale again.
  abstain_score_threshold: 0.0
  min_claim_overlap: 0.12
  max_claims: 2

golden:
  items_path: golden/v0.jsonl
