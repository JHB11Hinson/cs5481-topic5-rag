# Real pipeline over the Vault snapshot (tickets 04 + 05).
# Generation is still the stub: no LLM API key is configured on this machine, so
# answer quality is not measured here — retrieval metrics are.
run:
  name: real-hybrid
  out_root: runs

corpus:
  source: data/corpus/vault-1.21.x-1817bdfe/docs_structured.jsonl
  snapshot_id: vault-1.21.x-1817bdfe

chunk:
  strategy: recursive_parent_child
  size: 512
  overlap: 64
  parent_size: 1024

embed:
  provider: bge-m3
  model_id: BAAI/bge-m3
  device: cuda
  batch_size: 8
  # Chunk path caps at 1024 tokens: sentence-transformers pads every batch to the
  # configured length, so 8192 here means 8x8192^2 attention and an OOM on 6 GB.
  # The 8192 window belongs to the late-chunking document path (ticket 09), batch 1.
  max_seq_length: 1024
  cache_path: data/cache/embeddings.sqlite

index:
  backend: qdrant
  path: data/index

retrieval:
  mode: hybrid
  k: 10
  rrf_k: 60
  reranker: BAAI/bge-reranker-v2-m3
  rerank_top: 8

context:
  mode: plain

generate:
  provider: stub
  model_id: stub-generator
  # Scale matters: dense scores are cosine (0-1), RRF fused scores are ~1/(60+rank)
  # so a threshold of 0.2 would reject everything. The sweep in ticket 11 has to be
  # run per mode for exactly this reason.
  abstain_score_threshold: 0.01
  min_claim_overlap: 0.12
  max_claims: 2

golden:
  items_path: golden/v0.jsonl
